services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smc_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-smc_assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smc_assistant} -d ${POSTGRES_DB:-smc_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+psycopg://smc_assistant:change-me-local-only@postgres:5432/smc_assistant
      WEBHOOK_EVENT_REPOSITORY: postgres
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}'
      PAPER_MAX_RISK_PER_TRADE_PERCENT: ${PAPER_MAX_RISK_PER_TRADE_PERCENT:-1.0}
      PAPER_MAX_DAILY_LOSS_R: ${PAPER_MAX_DAILY_LOSS_R:-3.0}
      PAPER_MAX_CONSECUTIVE_LOSSES: ${PAPER_MAX_CONSECUTIVE_LOSSES:-3}
      PAPER_MINIMUM_RISK_REWARD: ${PAPER_MINIMUM_RISK_REWARD:-2.0}
      PAPER_MAX_OPEN_POSITIONS: ${PAPER_MAX_OPEN_POSITIONS:-3}
      PAPER_COOLDOWN_MINUTES: ${PAPER_COOLDOWN_MINUTES:-15}
      PAPER_SETUP_SCORE_MINIMUM: ${PAPER_SETUP_SCORE_MINIMUM:-70.0}
      PAPER_ALLOWED_SESSIONS: '${PAPER_ALLOWED_SESSIONS:-["ASIA","LONDON","NEW_YORK"]}'
      PAPER_CORRELATION_GROUPS: '${PAPER_CORRELATION_GROUPS:-[]}'
      PAPER_MAX_CORRELATED_POSITIONS: ${PAPER_MAX_CORRELATED_POSITIONS:-1}
      PAPER_AUTO_TRADE_ENABLED: ${PAPER_AUTO_TRADE_ENABLED:-true}
      PAPER_ACCOUNT_BALANCE: ${PAPER_ACCOUNT_BALANCE:-10000}
      PAPER_DEFAULT_RISK_PERCENT: ${PAPER_DEFAULT_RISK_PERCENT:-1}
      PAPER_NOTIFICATION_ADAPTER: ${PAPER_NOTIFICATION_ADAPTER:-log}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  postgres_data:
